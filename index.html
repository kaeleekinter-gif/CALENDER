
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calender</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff;
  color: #202124;
  font-family: Arial, sans-serif;
}

header {
  height: 68px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e8eaed;
}

.logo {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -1px;
}

.add-button {
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 24px;
  padding: 12px 19px;
  font-size: 14px;
  cursor: pointer;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 24px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.month-controls {
  display: flex;
  align-items: center;
  gap: 14px;
}

.month-controls h1 {
  font-size: 23px;
  font-weight: 500;
  min-width: 190px;
}

.nav-button {
  background: white;
  border: 1px solid #dadce0;
  border-radius: 50%;
  width: 35px;
  height: 35px;
  cursor: pointer;
  font-size: 18px;
}

.today-button, .view-button {
  background: white;
  border: 1px solid #dadce0;
  border-radius: 7px;
  padding: 9px 14px;
  cursor: pointer;
}

.view-options {
  display: flex;
  gap: 8px;
}

.view-button.active {
  background: #e8f0fe;
  border-color: #d2e3fc;
  color: #1967d2;
}

.calendar {
  border-top: 1px solid #dadce0;
  border-left: 1px solid #dadce0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.weekday {
  text-align: center;
  padding: 13px 3px;
  font-size: 12px;
  color: #5f6368;
  border-right: 1px solid #dadce0;
  border-bottom: 1px solid #dadce0;
}

.day {
  min-height: 112px;
  padding: 8px;
  border-right: 1px solid #dadce0;
  border-bottom: 1px solid #dadce0;
  cursor: pointer;
  background: white;
}

.day:hover {
  background: #f8faff;
}

.day.outside {
  background: #fafafa;
  color: #a0a0a0;
}

.day.selected {
  background: #f1f6ff;
}

.day-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 27px;
  height: 27px;
  font-size: 13px;
}

.day.today .day-number {
  background: #1a73e8;
  color: white;
  border-radius: 50%;
}

.event-pill {
  display: block;
  background: #d3e3fd;
  color: #174ea6;
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 11px;
  margin-top: 5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.agenda {
  margin-top: 25px;
  border-top: 1px solid #dadce0;
  padding-top: 17px;
}

.agenda h2 {
  font-size: 18px;
  font-weight: 500;
}

.agenda-event {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-bottom: 1px solid #eee;
}

.event-details {
  display: flex;
  gap: 12px;
  align-items: center;
}

.event-color {
  width: 4px;
  height: 37px;
  background: #1a73e8;
  border-radius: 5px;
}

.event-time {
  color: #5f6368;
  font-size: 13px;
  margin-top: 4px;
}

.event-actions {
  display: flex;
  gap: 6px;
}

.small-button {
  background: #f1f3f4;
  border: none;
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
}

.empty {
  color: #777;
  font-size: 14px;
  padding: 12px 0;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0006;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 420px;
  border-radius: 13px;
  padding: 23px;
  box-shadow: 0 8px 35px #0002;
}

.modal-content h2 {
  font-size: 21px;
  margin-top: 0;
  font-weight: 500;
}

.modal-content label {
  display: block;
  font-size: 13px;
  margin: 13px 0 5px;
  color: #555;
}

.modal-content input {
  width: 100%;
  padding: 12px;
  border: 1px solid #dadce0;
  border-radius: 7px;
  font-size: 15px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 22px;
}

.cancel-button {
  border: none;
  background: white;
  padding: 10px 14px;
  cursor: pointer;
}

.save-button {
  border: none;
  background: #1a73e8;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
}

.week-view {
  grid-column: 1 / -1;
}

@media(max-width: 600px) {
  header { padding: 0 14px; }
  main { padding: 16px 10px; }

  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .month-controls h1 {
    font-size: 20px;
    min-width: 170px;
  }

  .day {
    min-height: 75px;
    padding: 4px;
  }

  .weekday { font-size: 10px; }
  .event-pill { font-size: 9px; padding: 3px; }

  .calendar { gap: 0; }
}
</style>
</head>

<body>

<header>
  <div class="logo">Calender</div>
  <button class="add-button" onclick="openModal()">+ Add Event</button>
</header>

<main>
  <div class="toolbar">
    <div class="month-controls">
      <button class="nav-button" onclick="changeMonth(-1)">‹</button>
      <h1 id="monthTitle"></h1>
      <button class="nav-button" onclick="changeMonth(1)">›</button>
      <button class="today-button" onclick="goToday()">Today</button>
    </div>

    <div class="view-options">
      <button class="view-button active" id="monthBtn" onclick="setView('month')">Month</button>
      <button class="view-button" id="weekBtn" onclick="setView('week')">Week</button>
    </div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="agenda">
    <h2 id="agendaTitle">Your schedule</h2>
    <div id="agendaEvents"></div>
  </div>
</main>

<div class="modal" id="eventModal">
  <div class="modal-content">
    <h2 id="modalTitle">Add event</h2>

    <label for="eventName">Event name</label>
    <input id="eventName" placeholder="What are you doing?">

    <label for="eventDate">Date</label>
    <input id="eventDate" type="date">

    <label for="eventTime">Time (optional)</label>
    <input id="eventTime" type="time">

    <div class="modal-actions">
      <button class="cancel-button" onclick="closeModal()">Cancel</button>
      <button class="save-button" onclick="saveEvent()">Save</button>
    </div>
  </div>
</div>

<script>
let events = JSON.parse(localStorage.getItem("calenderEvents") || "[]");

let currentDate = new Date();
let selectedDate = dateString(new Date());
let view = "month";
let editingId = null;

function dateString(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function saveData() {
  localStorage.setItem("calenderEvents",JSON.stringify(events));
}

function render() {
  renderCalendar();
  renderAgenda();
}

function changeMonth(amount) {
  currentDate = new Date(
    currentDate.getFullYear(),
    currentDate.getMonth()+amount,
    1
  );
  render();
}

function goToday() {
  currentDate = new Date();
  selectedDate = dateString(new Date());
  render();
}

function setView(type) {
  view = type;
  document.getElementById("monthBtn").classList.toggle("active",type==="month");
  document.getElementById("weekBtn").classList.toggle("active",type==="week");
  render();
}

function selectDate(date) {
  selectedDate = date;
  currentDate = new Date(date+"T12:00:00");
  render();
}

function renderCalendar() {
  document.getElementById("monthTitle").textContent =
    currentDate.toLocaleDateString("en-US",{month:"long",year:"numeric"});

  let html = "";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(day => {
    html += `<div class="weekday">${day}</div>`;
  });

  let start;
  let total;

  if(view==="month") {
    start = new Date(currentDate.getFullYear(),currentDate.getMonth(),1);
    start.setDate(1-start.getDay());
    total = 42;
  } else {
    start = new Date(currentDate);
    start.setDate(start.getDate()-start.getDay());
    total = 7;
  }

  for(let i=0;i<total;i++) {
    let date = new Date(start);
    date.setDate(start.getDate()+i);
    let key = dateString(date);
    let isOutside = date.getMonth()!==currentDate.getMonth();
    let classes = "day";

    if(key===dateString(new Date())) classes+=" today";
    if(key===selectedDate) classes+=" selected";
    if(view==="month" && isOutside) classes+=" outside";

    let dayEvents = events.filter(e=>e.date===key);

    html += `
      <div class="${classes}" onclick="selectDate('${key}')">
        <span class="day-number">${date.getDate()}</span>
        ${dayEvents.slice(0,3).map(e=>`
          <span class="event-pill">${escapeHTML(e.name)}</span>
        `).join("")}
        ${dayEvents.length>3?`<span class="event-pill">+${dayEvents.length-3} more</span>`:""}
      </div>
    `;
  }

  document.getElementById("calendar").innerHTML = html;
}

function renderAgenda() {
  let date = new Date(selectedDate+"T12:00:00");

  document.getElementById("agendaTitle").textContent =
    date.toLocaleDateString("en-US",{
      weekday:"long",month:"long",day:"numeric"
    });

  let list = events
    .filter(e=>e.date===selectedDate)
    .sort((a,b)=>(a.time||"").localeCompare(b.time||""));

  if(!list.length) {
    document.getElementById("agendaEvents").innerHTML =
      '<div class="empty">No events scheduled. Add something to your day!</div>';
    return;
  }

  document.getElementById("agendaEvents").innerHTML = list.map(e=>`
    <div class="agenda-event">
      <div class="event-details">
        <div class="event-color"></div>
        <div>
          <strong>${escapeHTML(e.name)}</strong>
          <div class="event-time">${e.time ? formatTime(e.time) : "All day"}</div>
        </div>
      </div>
      <div class="event-actions">
        <button class="small-button" onclick="editEvent(${e.id})">Edit</button>
        <button class="small-button" onclick="deleteEvent(${e.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

function formatTime(time) {
  let [hours,minutes] = time.split(":");
  let d = new Date();
  d.setHours(Number(hours),Number(minutes));
  return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}

function openModal() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "Add event";
  document.getElementById("eventName").value = "";
  document.getElementById("eventDate").value = selectedDate;
  document.getElementById("eventTime").value = "";
  document.getElementById("eventModal").classList.add("open");
}

function closeModal() {
  document.getElementById("eventModal").classList.remove("open");
}

function saveEvent() {
  let name = document.getElementById("eventName").value.trim();
  let date = document.getElementById("eventDate").value;
  let time = document.getElementById("eventTime").value;

  if(!name || !date) {
    alert("Please enter an event name and date.");
    return;
  }

  if(editingId!==null) {
    events = events.map(e=>e.id===editingId?{...e,name,date,time}:e);
  } else {
    events.push({id:Date.now(),name,date,time});
  }

  selectedDate = date;
  currentDate = new Date(date+"T12:00:00");
  saveData();
  closeModal();
  render();
}

function editEvent(id) {
  let e = events.find(item=>item.id===id);
  if(!e) return;

  editingId = id;
  document.getElementById("modalTitle").textContent = "Edit event";
  document.getElementById("eventName").value = e.name;
  document.getElementById("eventDate").value = e.date;
  document.getElementById("eventTime").value = e.time || "";
  document.getElementById("eventModal").classList.add("open");
}

function deleteEvent(id) {
  if(!confirm("Delete this event?")) return;
  events = events.filter(e=>e.id!==id);
  saveData();
  render();
}

render();
</script>

</body>
</html>
